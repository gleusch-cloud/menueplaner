name: Sync Login Hotfix

on:
  push:
    paths:
      - '.github/workflows/sync-login-hotfix.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  hotfix-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Patch sync login state
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/main.js")
          s = p.read_text(encoding="utf-8")

          old = """function speichereSyncSession(session) {
            syncSession = session
            if (session) localStorage.setItem(SYNC_SESSION_KEY, JSON.stringify(session))
            else localStorage.removeItem(SYNC_SESSION_KEY)
          }"""
          new = """function syncBenutzerId() {
            if (syncSession?.user?.id) return syncSession.user.id
            const token = syncSession?.access_token
            if (!token) return null
            try {
              const teil = token.split('.')[1]
              if (!teil) return null
              const basis = teil.replace(/-/g, '+').replace(/_/g, '/')
              const gepolstert = basis.padEnd(Math.ceil(basis.length / 4) * 4, '=')
              return JSON.parse(atob(gepolstert)).sub || null
            } catch {
              return null
            }
          }

          function speichereSyncSession(session) {
            syncSession = session
            if (session) localStorage.setItem(SYNC_SESSION_KEY, JSON.stringify(session))
            else localStorage.removeItem(SYNC_SESSION_KEY)
          }"""
          if old not in s:
              raise SystemExit("session block not found")
          s = s.replace(old, new, 1)

          needle = """  speichereSyncSession(daten)
            await initialisiereCloudSync()
          }

          async function syncBestaetigungErneutSenden"""
          repl = """  speichereSyncSession(daten)
            await initialisiereCloudSync()
            render()
          }

          async function syncBestaetigungErneutSenden"""
          if needle not in s:
              raise SystemExit("login block not found")
          s = s.replace(needle, repl, 1)

          needle = """  speichereSyncSession(daten)
            await initialisiereCloudSync()
          }

          async function initialisiereCloudSync()"""
          repl = """  speichereSyncSession(daten)
            await initialisiereCloudSync()
            render()
          }

          async function initialisiereCloudSync()"""
          if needle not in s:
              raise SystemExit("register block not found")
          s = s.replace(needle, repl, 1)

          a = s.index("async function initialisiereCloudSync()")
          b = s.index("\n\nfunction planeCloudSync()", a)
          s = s[:a] + """async function initialisiereCloudSync() {
            if (!syncSession?.access_token) return false
            const userId = syncBenutzerId()
            if (!userId) {
              syncBereit = false
              syncStatus = 'Sync-Fehler'
              render()
              return false
            }

            syncStatus = 'Synchronisiere …'
            try {
              const response = await supabaseFetch(
                `/rest/v1/menueplaner_sync?user_id=eq.${encodeURIComponent(userId)}&select=daten,updated_at&limit=1`
              )
              if (!response.ok) throw new Error('Cloud-Daten konnten nicht geladen werden.')
              const zeilen = await response.json()

              if (zeilen.length) {
                uebernehmeSyncDaten(zeilen[0].daten)
                syncBereit = true
                syncStatus = 'Synchronisiert'
                location.reload()
                return true
              }

              syncBereit = true
              const gespeichert = await cloudSpeichern()
              render()
              return gespeichert
            } catch (fehler) {
              syncBereit = false
              syncStatus = 'Sync-Fehler'
              console.error(fehler)
              render()
              return false
            }
          }""" + s[b:]

          a = s.index("async function cloudSpeichern()")
          b = s.index("\n\nasync function cloudNeuLaden()", a)
          s = s[:a] + """async function cloudSpeichern() {
            if (!syncBereit || !syncSession?.access_token) return false
            const userId = syncBenutzerId()
            if (!userId) {
              syncStatus = 'Sync-Fehler'
              return false
            }

            syncStatus = 'Synchronisiere …'
            try {
              const response = await supabaseFetch('/rest/v1/menueplaner_sync?on_conflict=user_id', {
                method: 'POST',
                headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
                body: JSON.stringify({
                  user_id: userId,
                  daten: lokaleSyncDaten(),
                  updated_at: new Date().toISOString()
                })
              })
              if (!response.ok) throw new Error(await response.text())
              syncStatus = 'Synchronisiert'
              return true
            } catch (fehler) {
              syncStatus = 'Offline – lokal gespeichert'
              console.error(fehler)
              return false
            }
          }""" + s[b:]

          p.write_text(s, encoding="utf-8")

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git commit -m "Fix cloud sync after successful login"
          git push origin main

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
