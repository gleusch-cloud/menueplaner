name: Final Sync Repair

on:
  push:
    paths:
      - '.github/workflows/sync-login-hotfix.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: final-sync-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Repair sync behavior
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/main.js")
          s = p.read_text(encoding="utf-8")

          a = s.index("async function initialisiereCloudSync()")
          b = s.index("\n\nfunction planeCloudSync()", a)
          new_init = r'''async function initialisiereCloudSync() {
            if (!syncSession?.access_token) return false
            const userId = syncBenutzerId()
            if (!userId) {
              syncBereit = false
              syncStatus = 'Sync-Fehler'
              aktualisiereSyncAnzeige()
              return false
            }

            syncStatus = 'Synchronisiere …'
            aktualisiereSyncAnzeige(true)

            try {
              const response = await supabaseFetch(
                `/rest/v1/menueplaner_sync?user_id=eq.${encodeURIComponent(userId)}&select=daten,updated_at&limit=1`
              )
              if (!response.ok) throw new Error(await response.text() || 'Cloud-Daten konnten nicht geladen werden.')
              const zeilen = await response.json()

              if (zeilen.length) {
                const lokal = lokaleSyncDaten()
                const remote = zeilen[0].daten || {}
                syncBereit = true
                syncStatus = 'Synchronisiert ✓'

                if (JSON.stringify(lokal) !== JSON.stringify(remote)) {
                  uebernehmeSyncDaten(remote)
                  location.reload()
                  return true
                }

                aktualisiereSyncAnzeige()
                return true
              }

              syncBereit = true
              return await cloudSpeichern(true)
            } catch (fehler) {
              syncBereit = false
              syncStatus = 'Sync-Fehler'
              console.error(fehler)
              aktualisiereSyncAnzeige()
              return false
            }
          }'''
          s = s[:a] + new_init + s[b:]

          a = s.index("async function cloudSpeichern()")
          b = s.index("\n\nasync function cloudNeuLaden()", a)
          new_save = r'''async function cloudSpeichern(anzeigeAktualisieren = false) {
            if (!syncBereit || !syncSession?.access_token) return false
            const userId = syncBenutzerId()
            if (!userId) {
              syncStatus = 'Sync-Fehler'
              if (anzeigeAktualisieren) aktualisiereSyncAnzeige()
              return false
            }

            syncStatus = 'Synchronisiere …'
            if (anzeigeAktualisieren) aktualisiereSyncAnzeige(true)

            try {
              const response = await supabaseFetch('/rest/v1/menueplaner_sync?on_conflict=user_id', {
                method: 'POST',
                headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
                body: JSON.stringify({
                  user_id: userId,
                  daten: lokaleSyncDaten(),
                  updated_at: new Date().toISOString()
                })
              })
              if (!response.ok) throw new Error(await response.text())
              syncStatus = `Synchronisiert ✓ · ${new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}`
              if (anzeigeAktualisieren) aktualisiereSyncAnzeige()
              return true
            } catch (fehler) {
              syncStatus = 'Offline – lokal gespeichert'
              console.error(fehler)
              if (anzeigeAktualisieren) aktualisiereSyncAnzeige()
              return false
            }
          }'''
          s = s[:a] + new_save + s[b:]

          old = r'''async function cloudNeuLaden() {
            if (!syncSession?.access_token) return
            syncBereit = false
            await initialisiereCloudSync()
          }'''
          new = r'''function aktualisiereSyncAnzeige(laufend = false) {
            const status = document.querySelector('.sync-status')
            const button = document.querySelector('#syncJetzt')
            if (status) status.textContent = `Status: ${syncStatus}`
            if (button) {
              button.disabled = laufend
              button.textContent = laufend ? 'Synchronisiere …' : 'Jetzt synchronisieren'
            }
          }

          async function cloudNeuLaden() {
            if (!syncSession?.access_token) return false
            syncBereit = false
            return await initialisiereCloudSync()
          }'''
          if old not in s:
              raise SystemExit("cloudNeuLaden block not found")
          s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")

      - name: Remove one-shot workflow
        run: rm .github/workflows/sync-login-hotfix.yml

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js .github/workflows/sync-login-hotfix.yml
          git commit -m "Repair and verify cloud synchronization"
          git push origin main

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
