# deploy trigger: rpc-parser-fix
name: Menüplaner veröffentlichen

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Dateien laden
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Menüplaner bauen
        run: npm run build

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Fertige App hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

